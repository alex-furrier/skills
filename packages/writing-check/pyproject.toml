[project]
name = "safurrier-writing-check"
version = "1.0.0"
description = "Portable source-bound advisory Writing Check with bundled Vale policy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["vale==3.21.0.0"]
license = {text = "MIT"}
authors = [{name = "Safurrier"}]

[project.scripts]
writing-check = "writing_check.cli:entrypoint"
writing-check-sweep = "writing_check.sweep:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writing_check"]

[tool.hatch.build]
include = ["src/writing_check/**"]
