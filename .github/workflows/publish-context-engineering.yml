name: Publish Context Engineering
on:
  release:
    types: [published]
permissions: {}
jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'context-engineering-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check tag target and release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          python scripts/check_publish.py context-engineering "$GITHUB_REF" "$RELEASE_TAG"
      - name: Check release commit
        run: python scripts/fast_check.py
      - name: Build and validate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv build packages/context-engineering --out-dir dist
          rm dist/.gitignore
          python scripts/check_publish.py context-engineering "$GITHUB_REF" "$RELEASE_TAG" --dist dist
      - name: Record validated artifact digest
        id: digest
        run: echo "digest=$(sha256sum dist/* | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: context-engineering-dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-context-engineering
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist/
      - name: Verify validated artifact bytes
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          test "$(find dist -type f | wc -l)" -eq 2
          test "$(find dist -mindepth 1 -type d | wc -l)" -eq 0
          test "$(sha256sum dist/* | sha256sum | cut -d' ' -f1)" = "$EXPECTED_DIGEST"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
