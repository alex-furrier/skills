name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest mkdocs
      - name: Install Vale 3.17.1
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/vale_3.17.1_Linux_64-bit.tar.gz \
            https://github.com/vale-cli/vale/releases/download/v3.17.1/vale_3.17.1_Linux_64-bit.tar.gz
          echo 'db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd  /tmp/vale_3.17.1_Linux_64-bit.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/vale-bin
          tar -xzf /tmp/vale_3.17.1_Linux_64-bit.tar.gz -C /tmp/vale-bin vale
          sudo install -m 0755 /tmp/vale-bin/vale /usr/local/bin/vale
      - name: Verify Vale
        run: test "$(vale --version)" = "vale version 3.17.1"
      - run: python scripts/fast_check.py
      - run: uv run --project plugins/context-engineering/cli pytest -q
      - run: mkdocs build --strict
