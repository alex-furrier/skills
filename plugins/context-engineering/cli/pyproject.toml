[project]
name = "context-engineering"
version = "2.6.0"
description = "Shared CLI for the context-engineering plugin's analyzers."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
context-engineering = "context_engineering.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_engineering"]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that shell out to git in a loop or hit the real filesystem heavily",
]
